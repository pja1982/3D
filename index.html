    <style>
      @media print {
        html, body {
          background-color: #ffffff !important;
          background: #ffffff !important;
          color: #0f172a !important;
          margin: 0 !important;
          padding: 0 !important;
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* When printing from the document modal, hide the entire underlying application */
        body.print-document-active #root {
          display: none !important;
        }

        /* Hide screen-only app chrome and interactive buttons when printing */
        .no-print, nav, header, aside, footer, .modal-backdrop-print-hide {
          display: none !important;
        }

        /* Strip all dark backgrounds, modal frame borders, rounded corners, padding, and scrollbars */
        .print-modal-backdrop {
          position: static !important;
          display: block !important;
          background: transparent !important;
          background-color: transparent !important;
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
          padding: 0 !important;
          margin: 0 !important;
          overflow: visible !important;
          width: 100% !important;
          height: auto !important;
          max-height: none !important;
          inset: auto !important;
          z-index: auto !important;
        }

        .print-modal-dialog {
          position: static !important;
          display: block !important;
          background: transparent !important;
          background-color: transparent !important;
          border: none !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          padding: 0 !important;
          margin: 0 !important;
          max-width: 100% !important;
          max-height: none !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }

        .print-modal-scroll-area {
          position: static !important;
          display: block !important;
          background: transparent !important;
          background-color: transparent !important;
          padding: 0 !important;
          margin: 0 !important;
          overflow: visible !important;
          width: 100% !important;
          height: auto !important;
          max-height: none !important;
        }

        /* Clean printable container without shadows, borders, or black bounding boxes */
        #printable-document-content {
          display: block !important;
          position: static !important;
          width: 100% !important;
          max-width: 100% !important;
          min-height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          background-color: #ffffff !important;
          color: #0f172a !important;
          box-shadow: none !important;
          border: none !important;
          border-radius: 0 !important;
          overflow: visible !important;
        }

        .print-avoid-break, tr {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }

        @page {
          size: auto;
          margin: 12mm 15mm 15mm 15mm;
        }
      }
    </style>
