    <meta property="og:image" content="/favicon.svg" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('app_theme');
          var isDark = true;
          if (stored === 'light') {
            isDark = false;
          } else if (stored === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {}

      };

    <style>
      /* ==========================================================================
         LIGHT THEME CSS OVERRIDES (Activated when html.light or [data-theme="light"])
         ========================================================================== */
      html.light,
      html[data-theme="light"] {
        color-scheme: light;
      }

      html.light body,
      html[data-theme="light"] body {
        background-color: #f8fafc !important;
        color: #0f172a !important;
      }

      html.light .min-h-screen.bg-slate-900 {

      }

      /* Card & Surface Overrides in Light Mode */
      html.light .bg-slate-900,
      html.light .bg-slate-900\/90,
      html.light .bg-slate-900\/80,
      html.light .bg-slate-900\/70,
      html.light .bg-slate-900\/60,
      html.light .bg-slate-800,
      html.light .bg-slate-800\/90,
      html.light .bg-slate-800\/80,
      html.light .bg-slate-800\/70,
      html.light .bg-slate-800\/60,
      html.light .bg-slate-800\/50,
      html.light .bg-slate-800\/40 {

      /* Wells, Nested Cards, Code Containers */

      html.light .bg-slate-950\/90,
      html.light .bg-slate-950\/80,
      html.light .bg-slate-950\/70,
      html.light .bg-slate-950\/60,
      html.light .bg-slate-950\/40,
      html.light .bg-slate-900\/40 {

      }

      /* Form Controls (Inputs, Selects, Textareas) */
      html.light input:not([type="checkbox"]):not([type="radio"]):not([type="color"]):not([type="range"]),
      html.light select,
      html.light textarea,
      html.light .bg-slate-700 {

        color: #0f172a !important;
        border-color: #cbd5e1 !important;

      html.light input::placeholder,
      html.light textarea::placeholder {

      }

      html.light input:focus,
      html.light select:focus,
      html.light textarea:focus {
        border-color: #06b6d4 !important;
        box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.25) !important;
      }

      /* Borders & Dividers */
      html.light .border-slate-800,
      html.light .border-slate-700,
      html.light .border-slate-700\/90,
      html.light .border-slate-700\/80,
      html.light .border-slate-700\/70,
      html.light .border-slate-700\/60,

      }

      html.light .divide-slate-800 > :not([hidden]) ~ :not([hidden]),
      html.light .divide-slate-700 > :not([hidden]) ~ :not([hidden]) {
        border-color: #e2e8f0 !important;
      }

      /* Text Colors */
      html.light .text-slate-100,
      html.light .text-slate-200 {
        color: #0f172a !important;
      }

      html.light .text-slate-300 {
        color: #334155 !important;
      }

      html.light .text-slate-400 {
        color: #64748b !important;
      }

      html.light .text-slate-500 {
        color: #64748b !important;
      }

      /* Secondary Buttons & Actions in Light Mode */
      html.light button.bg-slate-800,
      html.light a.bg-slate-800 {
        background-color: #f1f5f9 !important;
        color: #1e293b !important;
        border-color: #cbd5e1 !important;
      }

      html.light button.bg-slate-800:hover,
      html.light a.bg-slate-800:hover {
        background-color: #e2e8f0 !important;
        color: #0f172a !important;
      }

      html.light button.bg-slate-700,
      html.light a.bg-slate-700 {
        background-color: #f1f5f9 !important;
        color: #1e293b !important;
        border-color: #cbd5e1 !important;
      }

      html.light button.bg-slate-700:hover,
      html.light a.bg-slate-700:hover {
        background-color: #e2e8f0 !important;
        color: #0f172a !important;
      }

      /* Keep action buttons with solid white text */
      html.light .bg-cyan-600,
      html.light .bg-cyan-500,
      html.light .bg-emerald-600,
      html.light .bg-emerald-500,
      html.light .bg-purple-600,
      html.light .bg-purple-500,
      html.light .bg-indigo-600,
      html.light .bg-indigo-500,
      html.light .bg-red-600,
      html.light .bg-rose-600 {

      }

      /* Navigation Bar in Light Mode */
      html.light nav > div.bg-slate-800 {
        background-color: #f1f5f9 !important;
        border-color: #cbd5e1 !important;
        box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05) !important;
      }

      html.light nav button.bg-slate-700 {
        background-color: #ffffff !important;
        color: #475569 !important;
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05) !important;
      }

      html.light nav button.bg-slate-700:hover {
        background-color: #e2e8f0 !important;
        color: #0f172a !important;
      }

      html.light nav button.bg-cyan-500 {
        background-color: #0891b2 !important;
        color: #ffffff !important;
        box-shadow: 0 1px 3px 0 rgb(8 145 178 / 0.3) !important;
      }

      /* Hover States & Table Rows in Light Mode */
      html.light .hover\:bg-slate-800\/40:hover,
      html.light .hover\:bg-slate-800\/50:hover,
      html.light .hover\:bg-slate-800\/70:hover,
      html.light .hover\:bg-slate-800:hover,
      html.light .hover\:bg-slate-700:hover {
        background-color: #f1f5f9 !important;
      }

      /* Enhanced Light Elevation & Shadows */
      html.light .shadow-lg,
      html.light .shadow-md {
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.06), 0 2px 4px -2px rgb(0 0 0 / 0.04) !important;
      }

      html.light .shadow-xl {
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04) !important;
      }

      html.light .shadow-2xl {
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.05) !important;
      }

      /* Modals Backdrop in Light Mode */
      html.light .fixed.inset-0.bg-black\/60,
      html.light .fixed.inset-0.bg-black\/70,
      html.light .fixed.inset-0.bg-slate-950\/70,
      html.light .fixed.inset-0.bg-slate-950\/80 {

      }

      /* Badges & Accent Wells in Light Mode */
      html.light .bg-cyan-950\/90,
      html.light .bg-cyan-950\/80,
      html.light .bg-cyan-950\/70,
      html.light .bg-cyan-950 {

        border-color: #e9d5ff !important;
        color: #6b21a8 !important;
      }

      html.light .bg-emerald-950\/80,
      html.light .bg-emerald-950\/60,
      html.light .bg-emerald-950 {
        background-color: #ecfdf5 !important;
        border-color: #a7f3d0 !important;
        color: #047857 !important;
      }

      html.light .bg-amber-950\/70,
      html.light .bg-amber-950\/40,
      html.light .bg-amber-950 {
        background-color: #fffbeb !important;
        border-color: #fde68a !important;
        color: #b45309 !important;
      }

      html.light .bg-rose-950\/70,
      html.light .bg-rose-950 {
        background-color: #fff1f2 !important;
        border-color: #fecdd3 !important;
        color: #be123c !important;
      }
      @media print {
        html, body {
          background-color: #ffffff !important;
          background: #ffffff !important;
          color: #0f172a !important;
          margin: 0 !important;
          padding: 0 !important;
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* When printing from the document modal, hide the entire underlying application */
        body.print-document-active #root {
          display: none !important;
        }

        /* Hide screen-only app chrome and interactive buttons when printing */
        .no-print, nav, header, aside, footer, .modal-backdrop-print-hide {
          display: none !important;
        }

        /* Strip all dark backgrounds, modal frame borders, rounded corners, padding, and scrollbars */
        .print-modal-backdrop {
          position: static !important;
          display: block !important;
          background: transparent !important;
          background-color: transparent !important;
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
          padding: 0 !important;
          margin: 0 !important;
          overflow: visible !important;
          width: 100% !important;
          height: auto !important;
          max-height: none !important;
          inset: auto !important;
          z-index: auto !important;
        }

        .print-modal-dialog {
          position: static !important;
          display: block !important;
          background: transparent !important;
          background-color: transparent !important;
          border: none !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          padding: 0 !important;
          margin: 0 !important;
          max-width: 100% !important;
          max-height: none !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }

        .print-modal-scroll-area {
          position: static !important;
          display: block !important;
          background: transparent !important;
          background-color: transparent !important;
          padding: 0 !important;
          margin: 0 !important;
          overflow: visible !important;
          width: 100% !important;
          height: auto !important;
          max-height: none !important;
        }

        /* Clean printable container without shadows, borders, or black bounding boxes */
        #printable-document-content {
          display: block !important;
          position: static !important;
          width: 100% !important;
          max-width: 100% !important;
          min-height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          background-color: #ffffff !important;
          color: #0f172a !important;
          box-shadow: none !important;
          border: none !important;
          border-radius: 0 !important;
          overflow: visible !important;
        }

        .print-avoid-break, tr {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }

        @page {
          size: auto;
          margin: 12mm 15mm 15mm 15mm;
