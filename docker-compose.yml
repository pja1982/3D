services:
  print-tracker:
    image: 3dcost-print-tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 3d-print-tracker
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - PORT=3030
      - DATA_DIR=/app/data
    volumes:
      # Persistent local storage on your Docker host machine:
      # All quotes, parts, printers, and settings are saved here in print-tracker-db.json!
      - /Docker/3Dcost:/app/data
