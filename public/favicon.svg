<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Cyan to Blue Neon Filament Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Hotend Extruder Brass Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Layer Top Face Gradient -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Layer Left Face Gradient -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Layer Right Face Gradient -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Cube -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Base: Rounded Squircle Badge -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="6" />

  <!-- Subtle Internal Grid Pattern to represent 3D print bed -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2">
    <line x1="120" y1="360" x2="392" y2="360" />
    <line x1="80" y1="400" x2="432" y2="400" />
    <line x1="160" y1="320" x2="352" y2="320" />
    <line x1="200" y1="320" x2="140" y2="420" />
    <line x1="256" y1="320" x2="256" y2="420" />
    <line x1="312" y1="320" x2="372" y2="420" />
  </g>

  <!-- 3D Printed Isometric Model Structure (Layered Precision Cube) -->
  <g filter="url(#shadow)">
    <!-- Layer 1 (Bottom Base Layer) -->
    <!-- Left Face -->
    <polygon points="256,366 156,308 156,280 256,338" fill="#0369a1" opacity="0.95" />
    <!-- Right Face -->
    <polygon points="256,366 356,308 356,280 256,338" fill="#0284c7" />
    <!-- Accent Line -->
    <polyline points="156,308 256,366 356,308" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" />

    <!-- Layer 2 (Middle Layer) -->
    <!-- Left Face -->
    <polygon points="256,330 156,272 156,244 256,302" fill="url(#leftFace)" />
    <!-- Right Face -->
    <polygon points="256,330 356,272 356,244 256,302" fill="url(#rightFace)" />
    <!-- Accent Line -->
    <polyline points="156,272 256,330 356,272" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0.8" />

    <!-- Layer 3 (Top Active Layer being extruded) -->
    <!-- Left Face -->
    <polygon points="256,294 156,236 156,208 256,266" fill="#0ea5e9" />
    <!-- Right Face -->
    <polygon points="256,294 356,236 356,208 256,266" fill="#38bdf8" />
    <!-- Top Face (Freshly deposited layer) -->
    <polygon points="256,150 356,208 256,266 156,208" fill="url(#topFace)" filter="url(#neonGlow)" />
    
    <!-- Fine Precision Infills / Toolpath on Top Face -->
    <path d="M 216 185 L 296 231 M 236 173 L 316 219 M 196 197 L 276 243" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- 3D Printer Extruder Assembly & Nozzle -->
  <g filter="url(#neonGlow)">
    <!-- Heater Block (Aluminum) -->
    <rect x="238" y="70" width="36" height="32" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2" />
    <!-- Heat Sink Fins -->
    <line x1="230" y1="62" x2="282" y2="62" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="234" y1="52" x2="278" y2="52" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="238" y1="42" x2="274" y2="42" stroke="#64748b" stroke-width="4" stroke-linecap="round" />

    <!-- Brass Extrusion Nozzle -->
    <polygon points="244,102 268,102 260,126 252,126" fill="url(#goldGrad)" stroke="#f59e0b" stroke-width="1.5" />
    
    <!-- Glowing Extruding Molten Filament Tip -->
    <circle cx="256" cy="132" r="5" fill="#38bdf8" />
    <line x1="256" y1="126" x2="256" y2="150" stroke="#67e8f9" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Subtle Quote / Precision Metric Accent (Dollar / Cost Tracker Tag) -->
  <g transform="translate(328, 92)">
    <circle cx="28" cy="28" r="26" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="3.5" />
    <text x="28" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#34d399" text-anchor="middle">$</text>
  </g>
</svg>
